# Blueprint de Render. Con este archivo en la raíz del repositorio, Render
# configura el servicio solo: no hay que rellenar nada a mano en su panel.
#
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: kohi-waitlist
    runtime: node

    # No quitar: sin esto Render podría asignar un plan de pago.
    plan: free
    region: oregon

    # --omit=dev deja fuera @playwright/test, que son ~100 MB de runner y
    # navegadores que el servidor de producción no necesita para nada.
    buildCommand: npm ci --omit=dev
    startCommand: npm start

    envVars:
      # Activa el guardarraíl de src/config.js: sin JWT_SECRET, no arranca.
      - key: NODE_ENV
        value: production

      # Render genera un valor aleatorio en el primer despliegue y lo conserva
      # entre despliegues. Nunca aparece en el repositorio.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 2h

      # El plan gratuito no admite discos persistentes, así que la base vive en
      # el sistema de archivos efímero del contenedor y se reinicia con cada
      # despliegue o suspensión. Con un plan de pago se añadiría un disco y
      # bastaría con apuntar esta variable a su punto de montaje.
      - key: KOHI_DB_PATH
        value: ./kohi.db

# Notas sobre dos ajustes que estuvieron aquí y se quitaron a propósito:
#
# - NODE_VERSION: fijaba 22.11.0. Innecesario: bcrypt y better-sqlite3 usan
#   N-API, cuyos binarios precompilados funcionan en cualquier versión de Node
#   sin recompilar. Fijar una versión exacta solo añade un punto de fallo si esa
#   versión no está disponible en la imagen de Render.
#
# - healthCheckPath: apuntaba a /api/health. Es útil en producción seria, pero
#   convierte cualquier demora del arranque en un despliegue marcado como
#   fallido. Sin él, Render da el servicio por vivo en cuanto el proceso escucha
#   en su puerto, que es lo que interesa aquí.
