<!doctype html>
<html lang="es">
<title>Entrar · Kōhi</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Accede a tu posición en la lista de espera de Kōhi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+JP:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">

<header class="topbar">
  <div class="shell">
    <a class="home" href="/">Kōhi</a>
    <a class="linkish" href="/register.html">Unirme a la lista</a>
  </div>
</header>

<main class="page">
  <div class="shell">

    <div class="card">
      <h1 class="card__title">Entrar</h1>
      <p class="card__sub">Consulta tu posición en la cola.</p>

      <p class="msg" id="msg" role="alert" data-testid="msg" hidden></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>
        </div>

        <button class="btn btn--primary btn--block" id="submit" type="submit">Entrar</button>
      </form>

      <p class="card__foot">¿Aún no estás en la lista? <a class="link" href="/register.html">Únete</a></p>
    </div>

  </div>
</main>

<footer class="footer">
  <div class="shell">
    <span>Kōhi · Café de especialidad</span>
    <span>Próxima apertura</span>
  </div>
</footer>

<script type="module" src="/js/login.js"></script>
