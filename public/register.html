<!doctype html>
<html lang="es">
<title>Unirme a la lista · Kōhi</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Únete a la lista de espera de la inauguración de Kōhi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Noto+Sans+JP:wght@200;300;400&display=swap" rel="stylesheet">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="/css/styles.css">

<header class="topbar">
  <div class="shell">
    <a class="home" href="/">Kōhi</a>
    <a class="linkish" href="/login.html">Ya tengo cuenta</a>
  </div>
</header>

<main class="page">
  <div class="shell">

    <div class="card" id="form-block">
      <h1 class="card__title">Unirme a la lista</h1>
      <p class="card__sub">Guardamos tu sitio para el día de la apertura.</p>

      <p class="msg" id="msg" role="alert" data-testid="msg" hidden></p>

      <form id="register-form" novalidate>
        <div class="field">
          <label for="name">Nombre</label>
          <!-- Los maxlength son solo comodidad: cuentan caracteres, mientras que
               el servidor mide bytes en la contraseña. Manda la validación del
               servidor, esto solo evita que escribas de más para nada. -->
          <input id="name" name="name" type="text" autocomplete="name" placeholder="Tu nombre" maxlength="80" required>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="tu@email.com" maxlength="254" required>
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="new-password" placeholder="Entre 8 y 72 caracteres" maxlength="72" required>
        </div>

        <div class="field">
          <label for="confirm">Confirmar contraseña</label>
          <input id="confirm" name="confirm" type="password" autocomplete="new-password" placeholder="Repite la contraseña" maxlength="72" required>
        </div>

        <button class="btn btn--primary btn--block" id="submit" type="submit">Unirme a la lista</button>
      </form>

      <p class="card__foot">¿Ya estás dentro? <a class="link" href="/login.html">Entra aquí</a></p>
    </div>

    <div class="card success" id="success-block" data-testid="success" hidden>
      <p class="success__label" lang="ja">珈琲</p>
      <!-- tabindex="-1": no entra en el orden de tabulacion, pero register.js
           le da el foco al mostrar el panel para anunciar el cambio de estado. -->
      <h1 class="success__title" id="success-title" tabindex="-1">¡Estás en la lista!</h1>
      <p class="queue" id="position" data-testid="position"></p>
      <hr class="rule rule--center">
      <p class="card__sub">Te avisaremos por email unos días antes de abrir.</p>
      <a class="btn btn--primary btn--block" href="/dashboard.html">Ver mi panel</a>
    </div>

  </div>
</main>

<footer class="footer">
  <div class="shell">
    <span>Kōhi · Café de especialidad</span>
    <span>Próxima apertura</span>
  </div>
</footer>

<script type="module" src="/js/register.js"></script>
